syntax = "proto3";

package tracking.v1;

option go_package = "github.com/GenesisEducationKyiv/software-engineering-school-6-0-ReilEgor/shared/infrastructure/grpc/proto/v1";

service TrackingService {
  rpc GetOrCreateRepository(GetOrCreateRepositoryRequest) returns (GetOrCreateRepositoryResponse);
}

message GetOrCreateRepositoryRequest {
  string full_name = 1;
}

message GetOrCreateRepositoryResponse {
  int64 id       = 1;
  string full_name = 2;
  string last_seen_tag = 3;
}
