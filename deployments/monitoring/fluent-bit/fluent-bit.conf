[SERVICE]
    Flush         2
    Log_Level     warn
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.type  filesystem
    storage.path  /tmp/fluent-bit-storage

# ============================
# INPUT: Docker container logs
# ============================
[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*.log
    Parser           docker
    Tag              docker.*
    Refresh_Interval 5
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    DB               /tmp/fluent-bit-pos.db
    storage.type     filesystem

# ============================
# FILTER: decode inner JSON (app slog output)
# ============================
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

# ============================
# FILTER: keep only app service logs
# ============================
[FILTER]
    Name    grep
    Match   docker.*
    Regex   container_name ^(repo-notifier-service|notification-worker|notification-sender)$

# ============================
# OUTPUT: Elasticsearch
# ============================
[OUTPUT]
    Name               es
    Match              docker.*
    Host               elasticsearch
    Port               9200
    Index              repo-notifier-logs
    Suppress_Type_Name On
    Time_Key           @timestamp
    Time_Key_Format    %Y-%m-%dT%H:%M:%S.%LZ
    Replace_Dots       On
    Retry_Limit        False
