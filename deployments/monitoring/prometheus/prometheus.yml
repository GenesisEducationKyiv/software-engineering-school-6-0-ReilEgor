global:
  scrape_interval: 3s

scrape_configs:
  - job_name: "RepoNotifier-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "repo-notifier-service:8080"

  - job_name: "tracking-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "tracking-service:8081"

  - job_name: "notification-sender"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "notification-sender:8082"